apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarm-checkin
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: swarm-checkin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarm-checkin
                port:
                  number: 80
